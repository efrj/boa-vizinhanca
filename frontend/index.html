<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>A Boa Vizinhança — Frases do Chaves em 15 Linguagens (Órbita)</title>
    <meta name="description" content="Página web interativa exibindo frases dos personagens da turma do Chaves, cada uma servida por uma linguagem de programação diferente.">
    <!-- Google Fonts Órbita Design System: Sora, Inter Tight, JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=Inter+Tight:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Estilos Órbita Customizados -->
    <link href="/css/style.css" rel="stylesheet">
    <!-- Alpine.js v3 (Simples, Leve e Reativo) -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Script Principal Alpine Component -->
    <script src="/js/main.js"></script>
  </head>
  <body x-data="neighborhood">
    
    <!-- Barra de Progresso Superior do Timer -->
    <div class="progress-timer-bar" :style="`width: ${timerProgress}%`"></div>

    <!-- Header Principal Órbita -->
    <header class="app-header py-3 mb-4">
      <div class="container-fluid px-4">
        <div class="d-flex flex-column flex-md-row align-items-center justify-content-between gap-3">
          
          <!-- Ilustração & Título -->
          <div class="d-flex align-items-center gap-3">
            <img src="/img/chaves-header-banner.png" alt="Chaves Animado" class="header-illustration">
            <div>
              <h1 class="app-title fs-2 mb-1">A Boa Vizinhança</h1>
              <p class="app-subtitle small mb-0 fw-medium">Linguagens de programação convivendo lado a lado em harmonia</p>
            </div>
          </div>

          <!-- Timer e Ação Manual -->
          <div class="d-flex align-items-center gap-3">
            <div class="timer-badge d-flex align-items-center gap-2">
              <i class="bi bi-clock-history fs-6" style="color: var(--secondary)"></i>
              <span>Novas frases em <strong x-text="countdown" style="color: var(--secondary)" class="fs-6 mono-font">7</strong>s</span>
            </div>
            <button @click="updateAllPhrases(); startTimer()" class="btn btn-orbita-cta btn-sm rounded-pill px-4 py-2 d-flex align-items-center gap-2">
              <i class="bi bi-arrow-clockwise" :class="{ 'spin-anim': characters.some(c => c.loading) }"></i>
              <span>Atualizar Frases</span>
            </button>
          </div>

        </div>
      </div>
    </header>

    <!-- Grid de Personagens / Cards Órbita -->
    <main class="container-fluid px-4">
      <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-xl-4 g-4">
        <template x-for="char in characters" :key="char.id">
          <div class="col">
            <div class="orbita-card">
              
              <!-- Top Banner com Gradiente do Tema e Ponto de Status -->
              <div class="card-banner-orbita" :class="char.style">
                <span class="status-dot" 
                      :class="{
                        'status-online': char.status === 'online',
                        'status-loading': char.status === 'loading',
                        'status-error': char.status === 'error'
                      }"
                      :title="`Status do Serviço: ${char.status}`">
                </span>
              </div>

              <!-- Header do Card: Foto do Personagem + Logo da Linguagem Lado a Lado -->
              <div class="card-header-row">
                <!-- Avatar (Lado Esquerdo - Clique para abrir modal) -->
                <div class="avatar-clickable" @click="openCharacterModal(char)" title="Clique para ver detalhes do personagem">
                  <img :src="char.avatar" :alt="char.name" class="avatar-img-orbita">
                </div>

                <!-- Logo da Linguagem (Lado Direito) -->
                <div class="lang-badge-pill" :title="`Linguagem: ${char.lang}`">
                  <img :src="char.langLogo" :alt="char.lang" class="lang-logo-orbita">
                </div>
              </div>

              <!-- Corpo do Card -->
              <div class="card-body-orbita">
                <!-- Nome do Personagem -->
                <h2 class="character-name-orbita" x-text="char.name"></h2>

                <!-- Balão de Fala Ilustrado Órbita -->
                <div class="quote-bubble-orbita">
                  <!-- Estado Carregando -->
                  <template x-if="char.loading">
                    <div class="d-flex align-items-center justify-content-center gap-2 py-2">
                      <span class="spinner-border spinner-border-sm" style="color: var(--primary)" role="status" aria-hidden="true"></span>
                      <span class="small fw-bold" style="color: var(--base)">Buscando frase...</span>
                    </div>
                  </template>

                  <!-- Frase Carregada -->
                  <template x-if="!char.loading">
                    <p class="quote-text-orbita" x-text="`“${char.phrase}”`"></p>
                  </template>
                </div>
              </div>

            </div>
          </div>
        </template>
      </div>
    </main>

    <!-- Modal de Detalhes do Personagem Órbita -->
    <div x-cloak x-show="showModal" class="modal fade" :class="{ 'show d-block': showModal }" tabindex="-1" style="background: rgba(40, 20, 115, 0.7); backdrop-filter: blur(8px);" @click.self="closeCharacterModal()" @keydown.escape.window="closeCharacterModal()">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content rounded-4 border-0 shadow-lg overflow-hidden">
          
          <!-- Cabeçalho do Modal no tema do personagem -->
          <div class="modal-header border-0 py-3" :class="selectedCharacter?.style || 'orbita-primary'">
            <h5 class="modal-title text-white fw-bold d-flex align-items-center gap-2" x-text="selectedCharacter?.name" style="font-family: var(--font-display)"></h5>
            <button type="button" class="btn-close btn-close-white" @click="closeCharacterModal()"></button>
          </div>

          <!-- Corpo do Modal -->
          <div class="modal-body text-center py-4 px-4 bg-white">
            <template x-if="selectedCharacter">
              <div>
                <!-- Fotografia Ampliada no Modal (220px) -->
                <div class="mb-4">
                  <img :src="selectedCharacter.avatar" :alt="selectedCharacter.name" class="img-fluid rounded-circle" style="width: 220px; height: 220px; object-fit: cover; border: 5px solid var(--primary-light); box-shadow: 0 0 0 4px var(--primary), 0 12px 32px rgba(40, 20, 115, 0.25);">
                </div>

                <!-- Nome do Personagem -->
                <h3 class="fw-bold mb-3" style="color: var(--tertiary); font-family: var(--font-display)" x-text="selectedCharacter.name"></h3>

                <!-- Logo da Linguagem -->
                <div class="d-inline-flex align-items-center justify-content-center px-4 py-3 bg-light border rounded-4 shadow-sm" :title="`Linguagem: ${selectedCharacter.lang}`">
                  <img :src="selectedCharacter.langLogo" :alt="selectedCharacter.lang" style="height: 50px; max-width: 140px; object-fit: contain;">
                </div>
              </div>
            </template>
          </div>

          <!-- Rodapé do Modal -->
          <div class="modal-footer border-0 bg-light justify-content-center py-3">
            <button type="button" class="btn btn-secondary rounded-pill px-4 fw-bold" @click="closeCharacterModal()">Fechar</button>
          </div>

        </div>
      </div>
    </div>

    <!-- Bootstrap 5.3 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  </body>
</html>
