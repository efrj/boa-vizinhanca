<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A Boa Vizinhança — Frases do Chaves em 15 Linguagens</title>
  <meta name="description"
    content="Página web interativa exibindo frases dos personagens da turma do Chaves, cada uma servida por uma linguagem de programação diferente.">

  <!-- Favicon Icons -->
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/img/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/img/apple-touch-icon.png">

  <!-- Local Bootswatch Brite 5 Theme CSS (via npm) -->
  <link rel="stylesheet" href="/node_modules/bootswatch/dist/brite/bootstrap.min.css">
  <!-- Local Bootstrap Icons CSS (via npm) -->
  <link rel="stylesheet" href="/node_modules/bootstrap-icons/font/bootstrap-icons.min.css">

  <!-- Local Fonts: Baloo 2 (Title) & Nunito (Subtitle) via @fontsource npm packages -->
  <link rel="stylesheet" href="/node_modules/@fontsource/baloo-2/800.css">
  <link rel="stylesheet" href="/node_modules/@fontsource/nunito/600.css">
  <link rel="stylesheet" href="/node_modules/@fontsource/nunito/700.css">
  <link rel="stylesheet" href="/node_modules/@fontsource/nunito/800.css">

  <!-- Local Prism.js Dark Theme & Line Numbers CSS (via npm) -->
  <link rel="stylesheet" href="/node_modules/prismjs/themes/prism-tomorrow.min.css">
  <link rel="stylesheet" href="/node_modules/prismjs/plugins/line-numbers/prism-line-numbers.min.css">

  <!-- Custom Stylesheet -->
  <link href="/css/style.css" rel="stylesheet">

  <!-- Local Prism.js Core & Plugins (via npm) -->
  <script src="/node_modules/prismjs/prism.js"></script>
  <script src="/node_modules/prismjs/plugins/line-numbers/prism-line-numbers.min.js"></script>
  <script src="/node_modules/prismjs/components/prism-markup-templating.min.js"></script>
  <script src="/node_modules/prismjs/components/prism-php.min.js"></script>
  <script src="/node_modules/prismjs/components/prism-python.min.js"></script>
  <script src="/node_modules/prismjs/components/prism-lua.min.js"></script>
  <script src="/node_modules/prismjs/components/prism-ruby.min.js"></script>
  <script src="/node_modules/prismjs/components/prism-perl.min.js"></script>
  <script src="/node_modules/prismjs/components/prism-go.min.js"></script>
  <script src="/node_modules/prismjs/components/prism-java.min.js"></script>
  <script src="/node_modules/prismjs/components/prism-swift.min.js"></script>
  <script src="/node_modules/prismjs/components/prism-bash.min.js"></script>
  <script src="/node_modules/prismjs/components/prism-crystal.min.js"></script>
  <script src="/node_modules/prismjs/components/prism-typescript.min.js"></script>
  <script src="/node_modules/prismjs/components/prism-coffeescript.min.js"></script>
  <script src="/node_modules/prismjs/components/prism-c.min.js"></script>
  <script src="/node_modules/prismjs/components/prism-cpp.min.js"></script>
  <script src="/node_modules/prismjs/components/prism-dart.min.js"></script>
  <script src="/node_modules/prismjs/components/prism-scala.min.js"></script>
  <script src="/node_modules/prismjs/components/prism-haskell.min.js"></script>
  <script src="/node_modules/prismjs/components/prism-ocaml.min.js"></script>
  <script src="/node_modules/prismjs/components/prism-nim.min.js"></script>
  <script src="/node_modules/prismjs/components/prism-zig.min.js"></script>
  <script src="/node_modules/prismjs/components/prism-basic.min.js"></script>
  <script src="/node_modules/prismjs/components/prism-vbnet.min.js"></script>

  <!-- Character Backend Code Snippets Repository -->
  <script src="/js/code-snippets.js"></script>

  <!-- Alpine.js v3 (Lightweight & Reactive via npm) -->
  <script defer src="/node_modules/alpinejs/dist/cdn.min.js"></script>
  <!-- Main Alpine Component Script -->
  <script src="/js/main.js?v=3"></script>
</head>

<body x-data="neighborhood">

  <!-- Top Timer Progress Bar -->
  <div class="progress-timer-bar" :style="`width: ${timerProgress}%`"></div>

  <!-- Main Bootswatch Brite Header -->
  <header class="app-header bg-warning text-white py-3 mb-4">
    <div class="container-fluid px-4">
      <div class="d-flex flex-column flex-md-row align-items-center justify-content-between gap-3">

        <!-- Banner Illustration & Title with Subtle Contrast Container -->
        <div class="header-brand-container d-flex align-items-center gap-3">
          <img src="/img/chaves-header-banner.png" alt="Chaves Animado" class="header-illustration">
          <div>
            <h1 class="app-header-title fs-2 mb-1">A Boa Vizinhança</h1>
            <p class="app-header-subtitle small mb-0">Linguagens de programação convivendo lado a lado em harmonia</p>
          </div>
        </div>

        <!-- Action Items: Timer Badge, Update Action, and GitHub Repository Link -->
        <div class="d-flex flex-wrap align-items-center gap-2 gap-sm-3">
          <!-- Countdown Timer Badge -->
          <div class="badge bg-light text-dark fs-6 rounded-pill px-3 py-2 d-flex align-items-center gap-2 shadow-sm">
            <i class="bi bi-clock-history text-primary"></i>
            <span>Novas frases em <strong x-text="countdown" class="text-primary fs-6">7</strong>s</span>
          </div>

          <!-- Manual Update Button -->
          <button @click="updateAllPhrases(); startTimer()"
            class="btn btn-light btn-sm rounded-pill px-4 py-2 fw-bold text-dark d-flex align-items-center gap-2 shadow-sm">
            <i class="bi bi-arrow-clockwise" :class="{ 'spin-anim': characters.some(c => c.loading) }"></i>
            <span>Atualizar Frases</span>
          </button>

          <!-- GitHub Repository Link Button -->
          <a href="https://github.com/efrj/boa-vizinhanca" target="_blank" rel="noopener noreferrer"
            class="btn btn-dark btn-sm rounded-pill px-3 py-2 fw-bold d-flex align-items-center gap-2 shadow-sm header-github-btn"
            title="Acessar repositório do projeto no GitHub">
            <i class="bi bi-github fs-6"></i>
            <span>Ver no GitHub</span>
          </a>
        </div>

      </div>
    </div>
  </header>

  <!-- Character Cards Grid Section -->
  <main class="container-fluid px-4">
    <div class="row row-cols-1 row-cols-lg-2 row-cols-xxl-3 g-4">
      <template x-for="char in characters" :key="char.id">
        <div class="col">
          <div class="brite-card">

            <!-- Top Banner with Theme Gradient and Service Status Indicator -->
            <div class="card-banner-brite" :class="char.style">
              <span class="status-dot" :class="{
                        'status-online': char.status === 'online',
                        'status-loading': char.status === 'loading',
                        'status-error': char.status === 'error'
                      }" :title="`Status do Serviço: ${char.status}`">
              </span>
            </div>

            <!-- Card Body: Horizontal Layout (Profile Left, Quote Right) -->
            <div class="card-body-brite">
              
              <!-- Left Profile Section: Avatar + Name & Language Logo beside it -->
              <div class="card-profile-section">
                <!-- Avatar (Left side of profile - Click to open modal) -->
                <div class="avatar-clickable" @click="openCharacterModal(char)"
                  title="Clique para ver o código backend do personagem">
                  <img :src="char.avatar" :alt="char.name" class="avatar-img-brite">
                </div>

                <!-- Name & Language Logo (Right of avatar, stacked vertically) -->
                <div class="character-info-col">
                  <h2 class="character-name-brite" x-text="char.name"></h2>
                  <div class="lang-badge-pill" :title="`Linguagem: ${char.lang}`">
                    <img :src="char.langLogo" :alt="char.lang" class="lang-logo-brite">
                  </div>
                </div>
              </div>

              <!-- Right Quote Section: Speech Bubble on the right side of the card -->
              <div class="card-quote-section">
                <div class="quote-bubble-brite">
                  <!-- Loading State -->
                  <template x-if="char.loading">
                    <div class="d-flex align-items-center justify-content-center gap-2 py-2 text-muted">
                      <span class="spinner-border spinner-border-sm text-primary" role="status" aria-hidden="true"></span>
                      <span class="small fw-bold">Buscando frase...</span>
                    </div>
                  </template>

                  <!-- Phrase Loaded State -->
                  <template x-if="!char.loading">
                    <p class="quote-text-brite" x-text="`“${char.phrase}”`"></p>
                  </template>
                </div>
              </div>

            </div>

          </div>
        </div>
      </template>
    </div>
  </main>

  <!-- Character Details Modal with CodeMirror Code Viewer (Extra Large Size) -->
  <div x-cloak x-show="showModal" class="modal fade" :class="{ 'show d-block': showModal }" tabindex="-1"
    style="background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(8px);" @click.self="closeCharacterModal()"
    @keydown.escape.window="closeCharacterModal()">
    <div class="modal-dialog modal-dialog-centered modal-xl">
      <div class="modal-content rounded-4 border-0 shadow-lg overflow-hidden">

        <!-- Modal Header with Character Theme Class -->
        <div class="modal-header border-0 py-3" :class="selectedCharacter?.style || 'bg-primary'">
          <h5 class="modal-title text-white fw-bold d-flex align-items-center gap-2">
            <i class="bi bi-code-slash fs-4"></i>
            <span>Código Backend — <span x-text="selectedCharacter?.name"></span></span>
          </h5>
          <button type="button" class="btn-close btn-close-white" @click="closeCharacterModal()"></button>
        </div>

        <!-- Modal Body (Two Column Layout: Character Profile & CodeMirror) -->
        <div class="modal-body py-4 px-4 bg-white">
          <template x-if="selectedCharacter">
            <div class="row g-4 align-items-center">

              <!-- Left Column: Enlarged Avatar, Name, and Language Badge -->
              <div class="col-lg-4 col-md-5 text-center border-end-md pe-md-4">
                <!-- Enlarged Avatar Image -->
                <div class="mb-3">
                  <img :src="selectedCharacter.avatar" :alt="selectedCharacter.name"
                    class="img-fluid rounded-circle shadow"
                    style="width: 180px; height: 180px; object-fit: cover; border: 5px solid #e9ecef; box-shadow: 0 12px 32px rgba(0, 0, 0, 0.2);">
                </div>

                <!-- Character Name & Language Pill -->
                <h3 class="fw-bold mb-2 text-dark" x-text="selectedCharacter.name"></h3>
                <span class="badge bg-primary rounded-pill mb-3 px-3 py-1 fs-6" x-text="selectedCharacter.lang"></span>

                <!-- Language Logo Container -->
                <div
                  class="d-flex align-items-center justify-content-center p-3 bg-light border rounded-4 shadow-sm w-100"
                  :title="`Linguagem: ${selectedCharacter.lang}`">
                  <img :src="selectedCharacter.langLogo" :alt="selectedCharacter.lang"
                    style="height: 52px; max-width: 150px; object-fit: contain;">
                </div>
              </div>

              <!-- Right Column: CodeMirror Editor with Formatted Backend Code -->
              <div class="col-lg-8 col-md-7">
                <div class="code-viewer-container">
                  <!-- Code Viewer Header Bar (IDE / Terminal Style) -->
                  <div class="code-viewer-header">
                    <div class="d-flex align-items-center gap-3">
                      <div class="code-dots">
                        <span class="code-dot code-dot-red"></span>
                        <span class="code-dot code-dot-yellow"></span>
                        <span class="code-dot code-dot-green"></span>
                      </div>
                      <span class="text-white-50 small font-monospace d-flex align-items-center gap-1">
                        <i class="bi bi-file-earmark-code text-warning"></i>
                        <strong x-text="activeCodeInfo.filename" class="text-white"></strong>
                      </span>
                    </div>

                    <!-- Copy Code Button -->
                    <button @click="copyBackendCode()"
                      class="btn btn-outline-light btn-sm rounded-pill px-3 d-flex align-items-center gap-2">
                      <i class="bi" :class="copiedToast ? 'bi-check2-circle text-success' : 'bi-clipboard'"></i>
                      <span x-text="copiedToast ? 'Copiado!' : 'Copiar Código'"></span>
                    </button>
                  </div>

                  <!-- Code Viewer Container with Prism Line Numbers -->
                  <pre
                    class="line-numbers code-editor-pre"><code id="code-viewer-element" :class="`language-${activeCodeInfo.prismLang || activeCodeInfo.mode}`" x-text="activeCodeInfo.code"></code></pre>
                </div>
              </div>

            </div>
          </template>
        </div>

        <!-- Modal Footer -->
        <div class="modal-footer border-0 bg-light justify-content-between py-3 px-4">
          <small class="text-muted font-monospace d-flex align-items-center gap-1">
            <i class="bi bi-info-circle text-primary"></i>
            <span>Código-fonte original utilizado pelo microsserviço no Docker</span>
          </small>
          <button type="button" class="btn btn-secondary rounded-pill px-4 fw-bold"
            @click="closeCharacterModal()">Fechar</button>
        </div>

      </div>
    </div>
  </div>

  <!-- Bootstrap 5.3 JS Bundle (via npm) -->
  <script src="/node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
